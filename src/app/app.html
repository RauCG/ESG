<div class="h-full bg-bg">
  @if (!isOnboarding()) {
    <div class="flex h-screen overflow-hidden">
      <aside class="flex w-60 shrink-0 flex-col border-r border-border bg-surface">
        <div class="flex items-center gap-2.5 px-5 py-5">
          <div class="grid h-9 w-9 place-items-center rounded-xl bg-gradient-to-br from-accent to-accent2 text-sm font-black text-white">E</div>
          <div>
            <div class="text-base font-black tracking-tight text-white">ESG</div>
            <div class="text-[10px] uppercase tracking-widest text-muted">Gestor de programas</div>
          </div>
        </div>

        <nav class="flex-1 space-y-1 px-3 py-2">
          <a routerLink="/inicio" routerLinkActive="bg-surface2 text-white"
            class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm text-slate-400 transition hover:bg-surface2 hover:text-white">
             <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1h-5v-7h-6v7H4a1 1 0 01-1-1V9.5z" /></svg>
            Inicio
          </a>
          <a routerLink="/programas" routerLinkActive="bg-surface2 text-white"
            class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm text-slate-400 transition hover:bg-surface2 hover:text-white">
             <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1" /><rect x="14" y="3" width="7" height="7" rx="1" /><rect x="3" y="14" width="7" height="7" rx="1" /><rect x="14" y="14" width="7" height="7" rx="1" /></svg>
            Programas
          </a>
          <a routerLink="/terminal" routerLinkActive="bg-surface2 text-white"
            class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm text-slate-400 transition hover:bg-surface2 hover:text-white">
             <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2" /><path d="M6 9l4 3-4 3M13 15h5" /></svg>
            Terminal
          </a>
          <a routerLink="/tienda" routerLinkActive="bg-surface2 text-white"
            class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm text-slate-400 transition hover:bg-surface2 hover:text-white">
             <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M3.1 5h17.8l-1.6 9a2 2 0 01-2 1.6H7.7a2 2 0 01-2-1.6L3.1 5z" /><path d="M9 20a1 1 0 100-2 1 1 0 000 2zM16 20a1 1 0 100-2 1 1 0 000 2" /></svg>
            Tienda
          </a>
          <a routerLink="/mantenimiento" routerLinkActive="bg-surface2 text-white"
            class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm text-slate-400 transition hover:bg-surface2 hover:text-white">
             <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M15 5a5 5 0 00-9.4 1L3 8l5 3-1.4 2.4A5 5 0 0010 5h5z" /><path d="M21 15a5 5 0 01-7.3 4.4L12 18l2-3 2 .6 2.4-1.4A5 5 0 0021 15z" /></svg>
            Mantenimiento
          </a>
          <a routerLink="/ajustes" routerLinkActive="bg-surface2 text-white"
            class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm text-slate-400 transition hover:bg-surface2 hover:text-white">
             <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1-1.6 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.6-1 1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.9.3h.1a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.9v.1a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z" /></svg>
            Ajustes
          </a>
        </nav>

        <div class="border-t border-border px-4 py-3">
          <div class="flex items-center justify-between text-[11px]">
            <span class="truncate text-muted">{{ settings.system()?.prettyName || 'Detectando…' }}</span>
            <span class="ml-2 h-2 w-2 shrink-0 rounded-full bg-ok"></span>
          </div>
        </div>
      </aside>

      <main class="flex-1 overflow-y-auto px-8 py-6 pb-56">
        <router-outlet />
      </main>
    </div>
  } @else {
    <router-outlet />
  }

  @if (!isOnboarding()) {
    <app-console />
  }
  <app-password-dialog />
</div>
